<section class="admin-login">

  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <!-- SECRET QUESTION PAGE -->
  <div class="security-stage" *ngIf="!securityPassed">

    <div class="funny-bot">
      <div class="bot-head">
        <div class="eyes">
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="bot-body"></div>
    </div>

    <div class="question-card">
      <p class="small-label">AI SECURITY CHECKPOINT</p>

      <h1>Before You Enter...</h1>

      <div class="speech-bubble">
        {{ funnyMessage }}
      </div>

      <input
        type="text"
        [(ngModel)]="secretAnswer"
        placeholder="Enter secret answer"
      />

      <button (click)="verifyAnswer()">
        Convince The Bot
      </button>
    </div>

  </div>

  <!-- PANDA LOGIN PAGE -->
  <div class="login-card" *ngIf="securityPassed">

    <div
      class="panda"
      [class.typing]="email"
      [class.hide-eyes]="passwordFocused"
    >
      <div class="panda-ear left"></div>
      <div class="panda-ear right"></div>

      <div class="panda-face">
        <div class="panda-eye left-eye">
          <div class="pupil"></div>
        </div>

        <div class="panda-eye right-eye">
          <div class="pupil"></div>
        </div>

        <div class="panda-hand left-hand"></div>
        <div class="panda-hand right-hand"></div>

        <div class="panda-nose"></div>
        <div class="panda-mouth"></div>
      </div>
    </div>

    <p class="admin-label">Portfolio Control Center</p>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Welcome back Shivam. Panda security is watching you.
    </p>

    <div class="input-group">
      <label>Email</label>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter admin email"
      />
    </div>

    <div class="input-group">
      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        (focus)="passwordFocused = true"
        (blur)="passwordFocused = false"
      />
    </div>

    <button (click)="login()" [disabled]="loading">
      {{ loading ? 'Checking...' : 'Enter Dashboard' }}
    </button>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</section>
