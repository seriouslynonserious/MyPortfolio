<section class="projects" id="projects">
  <p class="section-label">Projects</p>
  <h2>Personal Builds</h2>

  <div class="project-showcase">
    <div class="personal-project-card" *ngFor="let project of projects">
      <div class="project-number">✦</div>

      <h3>{{ project.title }}</h3>

      <p class="tech-stack">
        {{ project.skills }}
      </p>

      <p class="project-description">
        {{ project.description }}
      </p>
    </div>
  </div>
</section>
