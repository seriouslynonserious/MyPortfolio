server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.mvc.async.request-timeout=40000
portfolio.gemini.key=${GEMINI_API_KEY:}
portfolio.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
portfolio.contact.to=${CONTACT_TO:shivaay251202@gmail.com}
portfolio.contact.from=${CONTACT_FROM:}
portfolio.contact.enabled=${CONTACT_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
